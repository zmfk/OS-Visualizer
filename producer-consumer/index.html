<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验二：生产者消费者问题可视化</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="global-header">
  <div class="header-left">
    <span class="logo">⚡ OS Visualizer</span>
  </div>
  <nav class="header-nav">
    <a href="../cpu-scheduler/index.html" class="nav-item">实验一：CPU 调度</a>
    <a href="../producer-consumer/index.html" class="nav-item active">实验二：进程同步</a>
    <a href="../virtual-memory/index.html" class="nav-item">实验三：页面置换</a>
  </nav>
  <div class="header-right">
    <button class="btn-icon" id="themeBtn" title="切换主题">🌙</button>
  </div>
</header>

<main class="main">
  <div class="page-title">
    <h1>生产者消费者问题可视化</h1>
    <p>基于信号量 P/V 操作 · 环形缓冲区 · 同步与互斥演示</p>
  </div>

  <section class="card" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
    <div style="display: flex; gap: 12px; align-items: center;">
      <label style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">缓冲区容量：</label>
      <input type="number" id="capacityInput" value="12" min="1" max="30" style="width: 70px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; text-align: center; background: var(--bg-card); color: var(--text-primary);">
      <button id="resetBtn" class="btn btn-primary">重置并开始</button>
      <button id="pauseBtn" class="btn btn-outline">暂停</button>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <label style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">速度：</label>
      <input type="range" id="speedInput" min="0.25" max="4" step="0.25" value="1" style="accent-color: var(--accent);">
      <span id="speedValue" style="background: rgba(59,130,246,0.1); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;">1x</span>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
    <div class="card" style="text-align: center; padding: 24px; margin-bottom: 0;">
      <span style="display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">empty (空闲缓冲区)</span>
      <span style="font-size: 32px; font-weight: 800;" id="emptyCount">12</span>
    </div>
    <div class="card" style="text-align: center; padding: 24px; margin-bottom: 0;">
      <span style="display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">full (已有产品)</span>
      <span style="font-size: 32px; font-weight: 800;" id="fullCount">0</span>
    </div>
    <div class="card" style="text-align: center; padding: 24px; margin-bottom: 0;">
      <span style="display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">mutex (互斥量)</span>
      <span style="font-size: 32px; font-weight: 800;" id="mutexCount">1</span>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
    <div class="card thread-card producer-thread" id="producerCard" style="margin-bottom: 0; border-left: 6px solid var(--accent);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="margin: 0; font-size: 16px;">生产者线程</h3>
        <span class="status-dot" style="width: 10px; height: 10px; border-radius: 50%; background: var(--border);"></span>
      </div>
      <p id="producerStatus" style="margin: 0; font-size: 15px; font-weight: 600; color: var(--text-secondary);">未启动</p>
    </div>
    <div class="card thread-card consumer-thread" id="consumerCard" style="margin-bottom: 0; border-left: 6px solid var(--success);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="margin: 0; font-size: 16px;">消费者线程</h3>
        <span class="status-dot" style="width: 10px; height: 10px; border-radius: 50%; background: var(--border);"></span>
      </div>
      <p id="consumerStatus" style="margin: 0; font-size: 15px; font-weight: 600; color: var(--text-secondary);">未启动</p>
    </div>
  </section>

  <section class="card">
    <h2 style="margin: 0 0 16px; font-size: 18px; border-left: 4px solid var(--accent); padding-left: 8px;">环形缓冲区</h2>
    <div style="display: flex; gap: 24px; font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; justify-content: center;">
      <span><i style="display: inline-block; width: 16px; height: 16px; border-radius: 4px; background: var(--bg-input); border: 1px solid var(--border); vertical-align: middle; margin-right: 6px;"></i>空缓冲区</span>
      <span><i style="display: inline-block; width: 16px; height: 16px; border-radius: 4px; background: rgba(52, 211, 153, 0.2); border: 1px solid var(--success); vertical-align: middle; margin-right: 6px;"></i>有产品</span>
      <span><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--danger); vertical-align: middle; margin-right: 6px;"></i>生产指针</span>
      <span><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); vertical-align: middle; margin-right: 6px;"></i>消费指针</span>
    </div>
    <div class="ring-container" id="bufferRing" style="position: relative; width: 440px; height: 440px; margin: 0 auto; border: 2px dashed var(--border); border-radius: 50%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center;">
      <div class="ring-center" id="ringCenter" style="position: absolute; width: 160px; height: 160px; background: var(--bg-card); border: 4px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; z-index: 10;">等待开始</div>
    </div>
  </section>

  <section class="card">
    <h2 style="margin: 0 0 16px; font-size: 18px; border-left: 4px solid var(--accent); padding-left: 8px;">运行日志</h2>
    <ul id="logList" style="list-style: none; margin: 0; padding: 0; max-height: 250px; overflow-y: auto; font-family: var(--mono); font-size: 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-primary);"></ul>
  </section>
</main>

<script src="simulator.js"></script>
<script src="app.js"></script>
<script>
  const globalThemeBtn = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('cpu-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  if (globalThemeBtn) globalThemeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  if (globalThemeBtn) {
    globalThemeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cpu-theme', next);
      globalThemeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
  }
</script>
</body>
</html>
