<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验一：CPU 调度算法模拟器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="global-header">
  <div class="header-left">
    <span class="logo">⚡ OS Visualizer</span>
  </div>
  <nav class="header-nav">
    <a href="../cpu-scheduler/index.html" class="nav-item active">实验一：CPU 调度</a>
    <a href="../producer-consumer/index.html" class="nav-item">实验二：进程同步</a>
    <a href="../virtual-memory/index.html" class="nav-item">实验三：页面置换</a>
  </nav>
  <div class="header-right">
    <button class="btn-icon" id="global-theme-btn" title="切换主题">🌙</button>
  </div>
</header>

<div class="main">
  <div class="page-title">
    <h1>CPU 调度算法模拟器</h1>
    <p>支持 8 种经典调度算法 · 动画演示 · 算法对比</p>
  </div>

  <section class="card">
    <div class="section-header">
      <div class="section-title">
        <span class="step-num">1</span>配置进程
        <span class="count-badge" id="procCount">0</span>
      </div>
      <div class="section-actions">
        <select class="mini-select" id="presetSelect"><option value="">经典测试用例…</option></select>
        <button class="btn btn-outline" id="btnAdd">＋ 添加</button>
        <button class="btn btn-outline" id="btnImport">📂 导入</button>
        <button class="btn btn-outline" id="btnExportCfg">💾 保存配置</button>
        <button class="btn btn-outline" id="btnClear">清空</button>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>
    </div>
    <div class="process-grid" id="processList"></div>
    <p class="hint">平局规则：<b>先比较到达时间，再比较输入顺序</b>。优先级列仅在 <b>PRIO / PRIO-P</b> 中生效，<b>数值越小优先级越高</b>。</p>
  </section>

  <section class="card">
    <div class="section-header">
      <div class="section-title"><span class="step-num">2</span>选择调度算法</div>
    </div>
    <div class="algo-bar">
      <div class="algo-row">
        <div class="algo-pills" id="algoPills"></div>
        <div class="action-buttons">
          <div class="quantum-field" id="quantumField" style="display:none">
            <label>时间片 <input type="number" id="quantum" min="1" value="2"></label>
          </div>
          <button class="btn btn-primary" id="btnRun">▶ 开始调度</button>
          <button class="btn btn-outline" id="btnExportCsv">⬇ 导出 CSV</button>
        </div>
      </div>
      <div class="compare-controls">
        <span class="cc-label">算法对比</span>
        <select class="compare-select" id="compareA"></select>
        <span class="compare-vs">VS</span>
        <select class="compare-select" id="compareB"></select>
        <button class="btn btn-primary" id="btnCompare">⇄ 对比</button>
        <button class="btn btn-outline" id="btnSwap" title="交换左右">⇅</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-header">
      <div class="section-title">
        <span class="step-num">3</span>调度结果
        <span class="count-badge" id="resultMeta" style="display:none;"></span>
      </div>
    </div>
    <div class="result-area" id="resultArea">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <p>配置进程并选择算法后<br>点击「开始调度」逐步查看结果</p>
      </div>
    </div>
  </section>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="scheduler.js"></script>
<script src="app.js"></script>
<script>
  // 全局统一主题切换逻辑
  const globalThemeBtn = document.getElementById('global-theme-btn');
  const savedTheme = localStorage.getItem('os-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  if (globalThemeBtn) globalThemeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  if (globalThemeBtn) {
    globalThemeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('os-theme', next);
      globalThemeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
  }
</script>
</body>
</html>
